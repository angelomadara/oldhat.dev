<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oldhat.dev</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fff;
            color: #202124;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: left;
        }
        .container {
            max-width: 600px;
            padding: 40px;
        }
        .icon {
            font-size: 64px;
            color: #BDBDBD;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            font-weight: 400;
            margin: 0 0 15px 0;
            color: #202124;
        }
        .error-code {
            font-size: 14px;
            color: #5f6368;
            margin-bottom: 30px;
            display: block;
        }
        .actions {
            display: flex;
            gap: 12px;
        }
        .btn {
            padding: 8px 16px;
            font-size: 14px;
            border: 1px solid #dadce0;
            background: #f8f9fa;
            color: #1a73e8;
            cursor: pointer;
            border-radius: 4px;
            text-decoration: none;
        }
        .btn:hover {
            background: #f1f3f4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🌐</div>
        <h1>This site can’t be reached</h1>
        <span class="error-code">oldhat.dev’s server isn’t responding. ERR_CONNECTION_REFUSED</span>
        <div class="actions">
            <a href="#" class="btn" onclick="location.reload()">Reload</a>
        </div>
    </div>
</body>
</html>
