<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>oldhat.dev — 404 Page Not Found</title>
    <meta
      name="description"
      content="The page you're looking for doesn't exist on oldhat.dev."
    />
    <meta property="og:title" content="oldhat.dev — 404 Page Not Found" />
    <meta property="og:description" content="The page you're looking for doesn't exist on oldhat.dev." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://oldhat.dev/404.html" />
    <meta property="og:site_name" content="oldhat.dev" />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://oldhat.dev/" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <meta property="og:image" content="https://oldhat.dev/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <style>
      :root {
        --font:
          system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono:
          "SF Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
        --bg: #f8fafc;
        --fg: #0f172a;
        --card: #ffffff;
        --border: #e2e8f0;
        --muted: #64748b;
        --accent: #3b82f6;
      }
      .dark {
        --bg: #0f172a;
        --fg: #e2e8f0;
        --card: #1e293b;
        --border: #334155;
        --muted: #94a3b8;
        --accent: #60a5fa;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--fg);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .container {
        max-width: 960px;
        margin: 0 auto;
        padding: 16px;
        width: 100%;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 0;
        margin-bottom: 8px;
      }
      .logo {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      .logo span {
        color: var(--accent);
      }

      .theme-toggle {
        font-size: 13px;
        cursor: pointer;
        padding: 6px 14px;
        border-radius: 8px;
        background: var(--card);
        border: 1px solid var(--border);
        color: var(--fg);
        user-select: none;
        transition: background 0.2s;
      }
      .theme-toggle:hover {
        background: var(--border);
      }

      .error-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 48px 16px;
      }

      .error-code {
        font-size: 96px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -3px;
        color: var(--accent);
        margin-bottom: 8px;
      }
      .error-code span {
        color: var(--border);
      }

      .error-title {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 12px;
        letter-spacing: -0.3px;
      }

      .error-desc {
        font-size: 15px;
        color: var(--muted);
        max-width: 420px;
        margin-bottom: 32px;
        line-height: 1.6;
      }

      .home-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--accent);
        color: #fff;
        padding: 10px 24px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: opacity 0.2s;
      }
      .home-link:hover {
        opacity: 0.9;
      }

      .debug-hint {
        margin-top: 40px;
        font-size: 12px;
        color: var(--muted);
        font-family: var(--mono);
        padding: 10px 16px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        max-width: 100%;
        overflow-wrap: break-word;
        word-break: break-all;
      }
      .debug-hint span {
        color: var(--accent);
      }

      footer {
        text-align: center;
        padding: 24px 0;
        font-size: 13px;
        color: var(--muted);
      }
      footer a {
        color: var(--accent);
        text-decoration: none;
      }
      footer a:hover {
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        .error-code {
          font-size: 64px;
        }
        .error-title {
          font-size: 20px;
        }
        .error-desc {
          font-size: 14px;
        }
      }
    </style>
    <script>
      // Theme toggle (no framework — keeps it lightweight)
      document.addEventListener("DOMContentLoaded", () => {
        const stored = localStorage.getItem("theme");
        const prefers = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const isDark = stored === "dark" || (!stored && prefers);
        if (isDark) document.body.classList.add("dark");

        const btn = document.getElementById("theme-btn");
        if (btn) {
          btn.textContent = isDark ? "☀️ Light" : "🌙 Dark";
          btn.addEventListener("click", () => {
            document.body.classList.toggle("dark");
            const nowDark = document.body.classList.contains("dark");
            localStorage.setItem("theme", nowDark ? "dark" : "light");
            btn.textContent = nowDark ? "☀️ Light" : "🌙 Dark";
          });
        }
      });
    </script>
  </head>
  <body>
    <div class="container">
      <!-- ── Header ──────────── -->
      <header>
        <a href="https://oldhat.dev" style="text-decoration: none; color: inherit">
          <div class="logo">oldhat<span>.</span>dev</div>
        </a>
        <div class="theme-toggle" id="theme-btn">🌙 Dark</div>
      </header>

      <!-- ── Error Content ── -->
      <div class="error-section">
        <div class="error-code">4<span>0</span>4</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-desc">
          The page you're looking for doesn't exist, was moved, or never
          existed in the first place. Even our bots couldn't find it.
        </p>
        <a href="https://oldhat.dev" class="home-link">
          ← Back to Dashboard
        </a>
        <div class="debug-hint">
          <span>GET</span> <span id="requested-path">/unknown</span>
          <span style="color: var(--red, #ef4444)">→ 404 Not Found</span>
        </div>
      </div>

      <!-- ── Footer ── -->
      <footer>
        <p>
          oldhat.dev ·
          <a href="https://api.oldhat.dev/v1/health" target="_blank">API Health</a>
          ·
          <a href="https://github.com/angelomadara" target="_blank">GitHub</a>
        </p>
      </footer>
    </div>

    <script>
      // Show the actual requested path in the debug hint
      document.addEventListener("DOMContentLoaded", () => {
        const pathEl = document.getElementById("requested-path");
        if (pathEl) {
          pathEl.textContent = window.location.pathname + window.location.search;
        }
      });
    </script>
  </body>
</html>
