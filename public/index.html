<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oldhat.dev</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #1a1a2e;
            --muted: #6b7280;
            --card: #f3f4f6;
            --border: #e5e7eb;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --green: #10b981;
            --red: #ef4444;
            --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        .dark {
            --bg: #0f172a;
            --fg: #e2e8f0;
            --muted: #94a3b8;
            --card: #1e293b;
            --border: #334155;
            --accent: #60a5fa;
            --accent-hover: #3b82f6;
            --green: #34d399;
            --red: #f87171;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            line-height: 1.6;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 24px;
        }

        /* ── Header ──────────────────────── */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 48px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo span { color: var(--accent); }

        .theme-toggle {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-family: var(--font);
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ── Status Badge ─────────────────── */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .status-dot.offline { background: var(--red); box-shadow: 0 0 8px var(--red); }

        /* ── Cards ────────────────────────── */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
            transition: background 0.3s, border-color 0.3s;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .card-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-label {
            font-size: 13px;
            color: var(--muted);
        }

        /* ── Grid ─────────────────────────── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        /* ── Loading skeleton ──────────────── */
        .skeleton {
            background: linear-gradient(90deg, var(--card) 25%, var(--border) 50%, var(--card) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
            height: 20px;
            margin-bottom: 4px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ── Footer ───────────────────────── */
        footer {
            margin-top: 64px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--muted);
            text-align: center;
        }

        footer a { color: var(--accent); text-decoration: none; }
        footer a:hover { text-decoration: underline; }

        /* ── Transition helpers ────────────── */
    </style>
</head>
<body x-data="app()" x-init="init()" :class="{ dark: isDark }">

    <div class="container">

        <!-- ── Header ──────────────────────── -->
        <header>
            <div class="logo">oldhat<span>.</span>dev</div>
            <div class="theme-toggle" @click="toggleTheme" x-text="isDark ? '☀️ Light' : '🌙 Dark'"></div>
        </header>

        <!-- ── Status ───────────────────────── -->
        <div class="status-badge" style="margin-bottom: 32px;">
            <span class="status-dot" :class="apiStatus === 'ok' ? 'online' : 'offline'"></span>
            <span x-text="apiStatus === 'ok' ? 'API Online' : (apiStatus === 'loading' ? 'Checking...' : 'API Offline')"></span>
            <span style="color: var(--muted); font-weight: 400;" x-text="lastChecked"></span>
        </div>

        <!-- ── Stats Grid ──────────────────── -->
        <div class="stats-grid">
            <div class="card">
                <div class="card-title">Server Status</div>
                <template x-if="apiStatus === 'loading'">
                    <div><div class="skeleton" style="width: 60%;"></div><div class="skeleton" style="width: 40%;"></div></div>
                </template>
                <template x-if="apiStatus !== 'loading'">
                    <div>
                        <div class="card-value" x-text="healthData?.data?.status ?? '—'"></div>
                        <div class="card-label">Last health check</div>
                    </div>
                </template>
            </div>

            <div class="card">
                <div class="card-title">Total Requests</div>
                <template x-if="!visitorData">
                    <div><div class="skeleton" style="width: 50%;"></div></div>
                </template>
                <template x-if="visitorData">
                    <div>
                        <div class="card-value" x-text="visitorData?.data?.total_requests?.toLocaleString() ?? '—'"></div>
                        <div class="card-label" x-text="visitorData?.data?.report_date ?? 'latest report'"></div>
                    </div>
                </template>
            </div>

            <div class="card">
                <div class="card-title">Visitors Today</div>
                <template x-if="!visitorData">
                    <div><div class="skeleton" style="width: 40%;"></div></div>
                </template>
                <template x-if="visitorData">
                    <div>
                        <div class="card-value" x-text="visitorData?.data?.human_count?.toLocaleString() ?? '—'"></div>
                        <div class="card-label">
                            <span x-text="visitorData?.data?.bot_count?.toLocaleString() ?? '—'"></span> bots ·
                            <span x-text="visitorData?.data?.unique_ips?.toLocaleString() ?? '—'"></span> unique IPs
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- ── Footer ───────────────────────── -->
        <footer>
            <p>oldhat.dev · <a href="https://api.oldhat.dev/v1/health" target="_blank">API Health</a> · <a href="https://github.com/angelomadara" target="_blank">GitHub</a></p>
        </footer>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
    <script>
        function app() {
            return {
                // ── Theme ──
                isDark: localStorage.getItem('theme') === 'dark'
                        || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches),
                toggleTheme() {
                    this.isDark = !this.isDark;
                    localStorage.setItem('theme', this.isDark ? 'dark' : 'light');
                },

                // ── API Data ──
                apiStatus: 'loading',
                lastChecked: '',
                healthData: null,
                visitorData: null,

                async init() {
                    // Fetch API health
                    try {
                        const res = await fetch('https://oldhat.dev/api/v1/health');
                        this.healthData = await res.json();
                        this.apiStatus = 'ok';
                    } catch {
                        this.apiStatus = 'offline';
                    }
                    this.lastChecked = new Date().toLocaleTimeString();

                    // Fetch visitor stats (latest date)
                    try {
                        const dateRes = await fetch('https://oldhat.dev/api/v1/statistics/visitors');
                        this.visitorData = await dateRes.json();
                    } catch {
                        // No data yet today, silently ignore
                    }
                },
            }
        }
    </script>
</body>
</html>
